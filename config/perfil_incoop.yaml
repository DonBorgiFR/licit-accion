# Perfil de negocio de Incoop para filtrado y scoring de licitaciones
perfil:
  # Contrato de scoring v2: toda puntuación persistida y expuesta por la API vive en [0, 100].
  # El Filtro conserva sus señales ponderadas internamente y las normaliza contra este máximo.
  scoring:
    version: "2.0.0"
    maximo_bruto: 170
    umbral_alta: 65
    umbral_media: 40

  presupuesto:
    minimo: 35000.00
    maximo: 2000000.00
    
  procedimientos:
    - "Abierto"
    - "Abierto simplificado"

  # Filtros Duros de Exclusión por texto (Descarte inmediato)
  exclusiones:
    - "obras"
    - "construcción"
    - "suministro"
    - "ingeniería"
    - "arquitectura"
    - "software puro"
    - "renting"
    - "compra de equipos"
    - "energía"
    - "combustible"
    - "gasóleo"
    - "seguridad privada"
    - "vigilancia"
    - "ambulancia"
    - "seguro"
    - "seguros"
    - "póliza"

  # Palabras Clave de Advertencia (Penalización en Scoring)
  palabras_alerta:
    - "mantenimiento integral"
    - "obra menor"
    - "suministro de mobiliario"
    - "auditoría externa"
    - "equipamiento"
    - "renovación de calzada"
    - "impermeabilización"

